databases:
  # 1) Postgres Database (Free Tier Eligible)
  - name: inventory-db
    plan: free

services:
  # 2) Flask Backend
  - type: web
    name: inventory-api
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn run:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0

  # 3) React Frontend
  - type: web
    name: inventory-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_BASE_URL
        fromService:
          name: inventory-api
          type: web
          property: host
