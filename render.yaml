services:
  # 1) Postgres Database (Free Tier Eligible)
  - type: pgo
    name: inventory-db
    plan: free

  # 2) Flask Backend
  - type: web
    name: inventory-api
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn run:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0

  # 3) React Frontend
  - type: web
    name: inventory-frontend
    env: static
    plan: free
    buildCommand: "npm install && npm run build"
    publishPath: build
    envVars:
      - key: REACT_APP_API_BASE_URL
        # Once your API deploys, replace this value with the actual API URL (e.g. https://inventory-api-xxxx.onrender.com)
        value: "https://inventory-api.onrender.com"
